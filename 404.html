<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Страница не найдена — AMIN TV</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#f0f0f0;font-family:Inter,system-ui,sans-serif}
    main{width:min(560px,100%);padding:24px;text-align:center}
    a{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:8px;background:#c9a84c;color:#080808;text-decoration:none;font-weight:700}
    .lang-toggle{position:fixed;top:16px;right:16px;display:flex;gap:8px;padding:3px;border:1px solid rgba(212,175,55,.28)}
    .lang-btn{min-width:44px;min-height:44px;border:0;background:transparent;color:#aaa;font-weight:800;cursor:pointer}
    .lang-btn.active{background:#c9a84c;color:#080808}
    .lang-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  </style>
</head>
<body>
  <div class="lang-toggle" aria-label="Выбор языка">
    <button class="lang-btn" type="button" data-lang="tg" aria-label="Забони тоҷикӣ">ТҶ</button>
    <button class="lang-btn" type="button" data-lang="ru" aria-label="Русский язык">РУ</button>
  </div>
  <main>
    <h1>404</h1>
    <p>Страница не найдена.</p>
    <a href="/">На главную</a>
  </main>
  <script src="/i18n.js"></script>
</body>
</html>
